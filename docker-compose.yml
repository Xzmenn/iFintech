services:
  postgres:
    image: postgres:16
    container_name: ifintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ifintech
      POSTGRES_PASSWORD: ifintech
      POSTGRES_DB: ifintech
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - ifintech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifintech -d ifintech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ifintech-postgres-data:
